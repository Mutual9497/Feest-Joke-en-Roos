<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feestkaraoke</title>
  <style>
    :root {
      --bg: #111;
      --text: #f7f7f7;
      --muted: #999;
      --accent: #ffd54f;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main {
      width: min(900px, 94vw);
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .setup {
      display: grid;
      gap: 16px;
      background: #1d1d1d;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    input, textarea, button {
      font: inherit;
      border-radius: 12px;
      border: 0;
      padding: 12px 14px;
    }
    input, textarea {
      background: #2a2a2a;
      color: var(--text);
    }
    textarea {
      min-height: 220px;
      resize: vertical;
      text-align: left;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      color: #111;
      font-weight: 700;
    }
    .small {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .karaoke {
      display: none;
    }
    .current {
      font-size: clamp(2.3rem, 8vw, 5.8rem);
      line-height: 1.08;
      font-weight: 900;
      color: var(--accent);
      text-wrap: balance;
      margin-bottom: 32px;
    }
    .next {
      font-size: clamp(1.3rem, 4vw, 2.6rem);
      line-height: 1.15;
      color: var(--text);
      opacity: .65;
      text-wrap: balance;
    }
    .controls {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      gap: 10px;
      justify-content: center;
      opacity: .92;
    }
    .controls button {
      min-width: 110px;
    }
  </style>
</head>
<body>
  <main>
    <section class="setup" id="setup">
      <h1>Feestkaraoke</h1>
      <p class="small">
        Kies de karaoke-MP3 en plak de tekst met tijdcodes. Deze versie werkt lokaal op één apparaat.
        Later maken we hiervan een gedeelde versie voor telefoons met QR-code en host-sync.
      </p>

      <label>
        MP3-bestand
        <input id="audioFile" type="file" accept="audio/mpeg,audio/mp3,audio/*" />
      </label>

      <label>
        Lyrics met tijdcodes<br />
        <textarea id="lyricsInput">00:18 Joke en Roos zijn weer eens jarig
00:22 Wat men wel vieren mag
00:25 Want zulke vrolijke bejaarden
00:29 Zie je niet elke dag

00:32 Nu meer dan vijftig jaar geleden
00:36 Kon jullie liefde al niet op
00:40 Roos stapte in zijn auto
00:42 En sloeg zo twee keer over de kop

00:45 Oe Roos en Joke
00:49 Vijfenzeventig
00:52 Oe Roos en Joke
00:56 Vijfenzeventig

01:00 En nu zo vele jaren later
01:04 Is er heel wat opgebouwd
01:07 Steeds samen bikkelen in Frankrijk
01:11 Het voelt daar zo vertrouwd

01:14 En met die bodemloze liefde
01:18 Staan jullie voor een ieder klaar
01:21 Voor vrienden en familie
01:23 En natuurlijk Fae, Jasmijn en Saar

01:27 Oe Roos en Joke
01:31 Vijfenzeventig
01:34 Oe Roos en Joke
01:38 Vijfenzeventig

01:56 Wij hopen jullie te ervaren
01:59 Als jullie altijd zijn geweest
02:03 Nog vele, vele jaren
02:05 Maar nu eerst genieten van dit feest

02:09 Oe Roos en Joke
02:13 Vijfenzeventig
02:16 Oe Roos en Joke
02:20 Vijfenzeventig - 'zeventig

02:24 Oe Roos en Joke
02:27 Vijfenzeventig
02:30 Oe Roos en Joke
02:34 Vijfenzeventig</textarea>
      </label>

      <button id="startBtn">Start karaoke</button>
      <p class="small">
        Formaat per regel: <strong>mm:ss tekst</strong>, bijvoorbeeld <strong>01:24 Oe Roos en Joke</strong>.
      </p>
    </section>

    <section class="karaoke" id="karaoke">
      <div class="current" id="currentLine">Klaar om te zingen</div>
      <div class="next" id="nextLine"></div>
    </section>
  </main>

  <div class="controls" id="controls" style="display:none">
    <button id="playPauseBtn">Pauze</button>
    <button id="backBtn">-5 sec</button>
    <button id="forwardBtn">+5 sec</button>
  </div>

  <audio id="audio" preload="auto"></audio>

  <script>
    const audioFile = document.getElementById('audioFile');
    const lyricsInput = document.getElementById('lyricsInput');
    const startBtn = document.getElementById('startBtn');
    const setup = document.getElementById('setup');
    const karaoke = document.getElementById('karaoke');
    const controls = document.getElementById('controls');
    const audio = document.getElementById('audio');
    const currentLine = document.getElementById('currentLine');
    const nextLine = document.getElementById('nextLine');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const backBtn = document.getElementById('backBtn');
    const forwardBtn = document.getElementById('forwardBtn');

    let lyrics = [];

    function parseTime(timeText) {
      const parts = timeText.split(':').map(Number);
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      return NaN;
    }

    function parseLyrics(text) {
      return text
        .split('\n')
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => {
          const match = line.match(/^(\d{1,2}:\d{2}(?::\d{2})?)\s+(.+)$/);
          if (!match) return null;
          return { time: parseTime(match[1]), text: match[2] };
        })
        .filter(item => item && !Number.isNaN(item.time))
        .sort((a, b) => a.time - b.time);
    }

    function updateLyrics() {
      const t = audio.currentTime;
      let index = -1;

      for (let i = 0; i < lyrics.length; i++) {
        if (lyrics[i].time <= t) index = i;
        else break;
      }

      currentLine.textContent = index >= 0 ? lyrics[index].text : '...';
      nextLine.textContent = lyrics[index + 1]?.text || '';
      requestAnimationFrame(updateLyrics);
    }

    startBtn.addEventListener('click', async () => {
      if (!audioFile.files[0]) {
        alert('Kies eerst een MP3-bestand.');
        return;
      }

      lyrics = parseLyrics(lyricsInput.value);
      if (lyrics.length === 0) {
        alert('Plak eerst lyrics met tijdcodes, bijvoorbeeld: 00:05 Eerste regel');
        return;
      }

      audio.src = URL.createObjectURL(audioFile.files[0]);
      setup.style.display = 'none';
      karaoke.style.display = 'block';
      controls.style.display = 'flex';

      await audio.play();
      updateLyrics();
    });

    playPauseBtn.addEventListener('click', async () => {
      if (audio.paused) {
        await audio.play();
        playPauseBtn.textContent = 'Pauze';
      } else {
        audio.pause();
        playPauseBtn.textContent = 'Play';
      }
    });

    backBtn.addEventListener('click', () => {
      audio.currentTime = Math.max(0, audio.currentTime - 5);
    });

    forwardBtn.addEventListener('click', () => {
      audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + 5);
    });
  </script>
</body>
</html>
